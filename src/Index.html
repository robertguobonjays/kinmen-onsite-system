<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eff1f4; --card: #fff; --text: #1d2430; --muted: #667085; --line: #d3d8df; --field: #aab2bd;
    --primary: #1f6feb; --primary-weak: #eaf2ff; --ok: #1a8f4c; --ok-weak: #e8f6ee;
    --warn: #b7791f; --warn-weak: #fdf4e3; --bad: #d93a3a; --bad-weak: #fdeeee;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); }
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .hd-in { max-width: 1000px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 20px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 2px; flex: 1; height: 100%; }
  nav button { border: 0; background: none; padding: 0 12px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; font-family: inherit; position: relative; display: flex; align-items: center; gap: 6px; }
  nav button svg { display: none; }
  nav button.on { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--text); }
  nav .dot { position: absolute; top: 12px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .who { position: relative; margin-left: auto; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--primary-weak); color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .menu { position: absolute; right: 0; top: 42px; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(20,30,50,.14); min-width: 170px; padding: 6px; display: none; }
  .menu.on { display: block; }
  .menu .me { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text); }
  .menu button:hover { background: var(--bg); }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,30,50,.05); }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 .sp, .sp { flex: 1; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .big { font-size: 22px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .hello { margin: 2px 2px 14px; }
  .hello b { font-size: 20px; font-weight: 600; display: block; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--field); background: #fff; color: var(--text); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit; line-height: 1.3; text-decoration: none; display: inline-block; }
  .btn:hover { background: #f1f3f6; }
  .btn.p { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .btn.bad { color: var(--bad); }
  .btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
  .btn.ghost { border-color: var(--line); background: #fff; color: #4a5361; }
  .btn.ghost:hover { color: var(--text); background: var(--bg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: #f1f3f6; color: var(--muted); white-space: nowrap; font-weight: 500; }
  .tag.ok { background: var(--ok-weak); color: var(--ok); }
  .tag.warn { background: var(--warn-weak); color: var(--warn); }
  .tag.bad { background: var(--bad-weak); color: var(--bad); }
  .tag.p { background: var(--primary-weak); color: var(--primary); }
  .lv1 { background: var(--bad-weak); color: var(--bad); } .lv2 { background: var(--warn-weak); color: var(--warn); } .lv3 { background: #f1f3f6; color: #5b6573; }
  input, select, textarea { font-family: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--field); border-radius: 10px; background: #fff; max-width: 100%; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  input[type=checkbox], input[type=radio] { accent-color: var(--primary); }
  textarea { width: 100%; min-height: 80px; }
  label.f { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--muted); }
  .full { width: 100%; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: middle; }
  table.t th { font-weight: 500; color: var(--muted); font-size: 12px; }
  table.t tr:last-child td { border-bottom: 0; }
  .tw { overflow-x: auto; }
  .list-item { padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover { background: #fafbfc; }
  /* 待辦 */
  .todo { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .todo:last-child { border-bottom: 0; }
  .todo .ic { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .todo .ic.bad { background: var(--bad); } .todo .ic.p { background: var(--primary); }
  .todo .tx { flex: 1; }
  .todo .go { color: var(--muted); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .kv span:first-child { color: var(--muted); white-space: nowrap; }
  /* 月曆 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .hd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal .d { background: #fff; border: 1px solid var(--field); border-radius: 10px; min-height: 72px; padding: 5px 6px; cursor: pointer; font-size: 12px; position: relative; overflow: hidden; }
  .cal .d:hover { border-color: var(--primary); }
  .cal .d.past { opacity: .45; }
  .cal .d.today { border-color: var(--text); }
  .cal .d.mineoff { background: var(--bad-weak); }
  .cal .d.gap { border-color: var(--bad); }
  .cal .n { font-size: 13px; color: #5b6573; }
  .cal .we .n { color: var(--bad); }
  .cal .who { display: block; margin-top: 4px; padding: 2px 6px; border-radius: 6px; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .off { display: block; color: var(--bad); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .mk { position: absolute; right: 6px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); font-size: 0; }
  .cal .d.mine { border: 2px solid var(--primary); padding: 4px 5px; }
  .notice { border: 1px solid #b9d2fb; background: var(--primary-weak); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .notice b { display: block; font-size: 16px; margin-bottom: 2px; }
  .notice.warn { border-color: #efd28f; background: var(--warn-weak); }
  .notice.ok { border-color: #a9dcbd; background: var(--ok-weak); }
  .lv { padding: 13px 0; border-top: 1px solid var(--line); }
  .lv .row { flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  /* 巡檢 */
  .chk { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .chk:last-child { border-bottom: 0; }
  .seg { display: inline-flex; background: #f1f3f6; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; font-size: 14px; font-family: inherit; border-radius: 8px; color: #5b6573; }
  .seg button.on-ok { background: #fff; color: var(--ok); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg button.on-bad { background: #fff; color: var(--bad); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chk .ext { grid-column: 1 / -1; display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chk.abn .ext { display: flex; }
  /* 選項 chip */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { border: 1px solid var(--field); border-radius: 10px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
  .chips input { display: none; }
  .chips input:checked + span { color: var(--primary); font-weight: 600; }
  .chips label:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); }
  .lvbox { border: 1px solid var(--field); border-radius: 10px; padding: 9px 12px; margin: 6px 0; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .lvbox:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); }
  /* SOP 內容 */
  .doc h3 { font-size: 15px; margin: 18px 0 6px; }
  .doc ul, .doc ol { margin: 4px 0; padding-left: 22px; }
  .doc p { margin: 4px 0; }
  .timeline { font-size: 13px; background: var(--bg); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; }
  /* 叫修列表 */
  .tk { display: flex; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tk:last-child { border-bottom: 0; }
  .tk .bar { width: 4px; border-radius: 2px; flex: none; background: #c9cfd8; }
  .tk .bar.l1 { background: var(--bad); } .tk .bar.l2 { background: var(--warn); }
  .tk .bd { flex: 1; min-width: 0; }
  .tk .t1 { display: flex; gap: 8px; align-items: center; }
  .tk .t1 b { font-weight: 600; }
  .tk .sym { color: #4a5361; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 打卡 */
  .punch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .punch button { border: 0; border-radius: 12px; padding: 18px 8px; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .punch .in { background: var(--text); color: #fff; } .punch .out { background: #f1f3f6; color: var(--text); }
  .punch button.done { background: var(--ok-weak); color: var(--ok); }
  .punch small { display: block; font-size: 13px; font-weight: normal; opacity: .75; margin-top: 2px; }
  .thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; vertical-align: middle; margin-left: 6px; background: #f1f3f6; }
  #pPrev { max-width: 100%; max-height: 260px; border-radius: 12px; display: none; margin-top: 10px; }
  .camera-btn { display: block; text-align: center; background: var(--bg); border-radius: 12px; padding: 26px 10px; cursor: pointer; color: #5b6573; }
  .camera-btn input { display: none; }
  .drop { display: block; text-align: center; border: 1.5px dashed var(--field); border-radius: 12px; padding: 18px 10px; cursor: pointer; color: #5b6573; font-size: 14px; }
  .drop:hover, .drop.on { border-color: var(--primary); background: var(--primary-weak); }
  .drop input { display: none; }
  .att { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .att:last-child { border-bottom: 0; }
  .att .ext { flex: none; width: 42px; text-align: center; border-radius: 6px; padding: 2px 0; font-size: 11px; font-weight: 600; background: #f1f3f6; color: #5b6573; }
  .att .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters input[type=date] { width: 150px; }
  /* modal / toast */
  .mask { position: fixed; inset: 0; background: rgba(15,20,30,.35); display: none; align-items: flex-start; justify-content: center; z-index: 20; overflow-y: auto; padding: 32px 12px; }
  .mask.on { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(15,20,30,.2); }
  .modal h3 { margin: 0 0 12px; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .modal h3 .x { margin-left: auto; cursor: pointer; font-size: 22px; color: var(--muted); border: 0; background: none; line-height: 1; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 10px; display: none; z-index: 30; max-width: 90vw; font-size: 14px; }
  #toast.bad { background: var(--bad); }
  #loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; display: none; z-index: 40; overflow: hidden; }
  #loading::before { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, transparent, #6ea8ff, var(--primary)); animation: ld 1.1s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes ld { 0% { left: -45% } 100% { left: 100% } }
  .loader { animation: fadein .2s ease both; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .load-tx { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 14px; color: var(--muted); font-size: 13px; }
  .load-tx i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: dot 1.1s ease-in-out infinite; }
  .load-tx i:nth-child(2) { animation-delay: .15s; } .load-tx i:nth-child(3) { animation-delay: .3s; margin-right: 2px; }
  @keyframes dot { 0%, 70%, 100% { transform: translateY(0); opacity: .35 } 35% { transform: translateY(-5px); opacity: 1 } }
  .sk { display: block; height: 14px; border-radius: 7px; margin-bottom: 12px; background: linear-gradient(90deg, #eef0f4 25%, #f8f9fb 50%, #eef0f4 75%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  .sk:last-child { margin-bottom: 0; }
  .sk.h { width: 28%; height: 16px; margin-bottom: 18px; } .sk.w8 { width: 82%; } .sk.w6 { width: 62%; } .sk.w4 { width: 44%; }
  .sk.block { height: 74px; border-radius: 12px; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .sk, .load-tx i, #loading::before { animation-duration: 3s; } }
  .url { display: block; margin: 6px 0 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 14px; word-break: break-all; color: var(--text); text-decoration: none; }
  .sub { display: inline-flex; background: #e1e5ea; border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 14px; flex-wrap: wrap; }
  .sub button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; color: #5b6573; }
  .sub button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .empty { color: var(--muted); padding: 14px 0; text-align: center; font-size: 14px; }
  .pw { position: relative; }
  .pw input { width: 100%; padding-right: 44px; }
  .pw input::-ms-reveal, .pw input::-ms-clear { display: none; }
  .pw .eye { position: absolute; top: 0; right: 0; bottom: 0; width: 44px; border: 0; background: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
  .pw .eye:hover { color: var(--text); }
  .pw .eye svg { width: 20px; height: 20px; }
  .cal .who small { display: block; font-size: 10px; font-weight: 500; }
  .lvbox .tms { display: flex; gap: 4px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .lvbox .tms input { padding: 4px 6px; font-size: 13px; }
  .avt th, .avt td { white-space: nowrap; padding: 6px 8px; font-size: 13px; }
  .avt tr { cursor: pointer; }
  .avt tr:hover td { background: #f7f9fc; }
  .avt .on { color: var(--primary); font-weight: 700; }
  .avt .no { color: var(--bad); }
  .ln { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: #4a5361; margin-top: 3px; cursor: pointer; }
  .ln input { margin-top: 4px; }
  .major { font-size: 14px; font-weight: 700; margin: 16px 0 2px; padding: 6px 10px; background: var(--bg); border-radius: 8px; }
  .minor { font-size: 13px; font-weight: 600; color: var(--primary); margin: 10px 0 0; }
  .tkt tr[onclick] { cursor: pointer; }
  .tkt tr[onclick]:hover td { background: #f7f9fc; }
  .tkt td { font-size: 13px; }
  .tkt .sy { max-width: 260px; overflow-wrap: anywhere; }
  .only-narrow { display: none; }
  .post { padding: 12px 0; border-top: 1px solid var(--line); }
  .post:first-child { border-top: 0; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  .reply { margin: 8px 0 0 12px; padding: 8px 12px; background: var(--bg); border-radius: 10px; }
  .morelist button { display: flex; width: 100%; border: 0; background: none; padding: 13px 8px; font-size: 15px; font-family: inherit; color: var(--text); border-bottom: 1px solid var(--line); cursor: pointer; justify-content: space-between; }
  nav .m-more { display: none; }
  #print { display: none; }
  @media print {
    body.printing > *:not(#print) { display: none !important; }
    body.printing #print { display: block; font-size: 12pt; }
    #print table { width: 100%; border-collapse: collapse; }
    #print th, #print td { border: 1px solid #000; padding: 5px; text-align: left; vertical-align: top; }
    #print h2 { text-align: center; }
  }
  /* 電腦版：字與元件放大，內容區加寬 */
  @media screen and (min-width: 1024px) {
    html { zoom: 1.15; }
    .hd-in, main { max-width: 1240px; }
    .modal { max-width: 660px; }
  }
  @media screen and (min-width: 1600px) { html { zoom: 1.3; } }
  @media (min-width: 761px) and (max-width: 1180px) { header h1 { display: none; } }
  /* 手機：選單改到底部 */
  @media (max-width: 760px) {
    .hd-in { height: 52px; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; height: auto; background: #fff; border-top: 1px solid var(--line); gap: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
    nav button { flex: 1; flex-direction: column; gap: 2px; padding: 7px 0 6px; font-size: 11px; }
    nav button svg { display: block; width: 22px; height: 22px; }
    nav .m-hide { display: none; }
    nav .m-more { display: flex; }
    .only-wide { display: none; }
    .only-narrow { display: block; }
    nav button.on { box-shadow: none; color: var(--primary); }
    nav .dot { top: 5px; right: calc(50% - 16px); }
    main { padding: 14px 12px 90px; }
    .card { padding: 16px; }
    .cal { gap: 2px; }
    .cal .d { min-height: 58px; padding: 3px; border-radius: 8px; }
    .cal .who { font-size: 11px; padding: 1px 3px; }
    table.t { font-size: 13px; }
    .modal { padding: 18px; }
    .filters input[type=date] { flex: 1; width: auto; min-width: 0; }
    .filters select { flex-basis: 100%; }
    .card h2 > .row { width: 100%; justify-content: flex-end; }
    #toast { bottom: 84px; }
  }
</style>
</head>
<body>
<div id="loading"></div>
<header><div class="hd-in"><h1 id="appTitle">駐點維運系統</h1><nav id="nav"></nav><div class="who" id="who"></div></div></header>
<main id="main"><div class="loader"><div class="load-tx"><i></i><i></i><i></i>載入中</div><div class="card"><span class="sk h"></span><span class="sk block"></span></div><div class="card"><span class="sk h"></span><span class="sk"></span><span class="sk w8"></span><span class="sk w6"></span><span class="sk w4"></span></div></div></main>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
var APP = { init: null, page: 'home', month: null, tkFilter: 'open', tkSub: 'tickets', inspSub: 'fill', inspDate: null, sopCat: '全部', sopQ: '', adminSub: 'people', schSub: 'plan', leaveWho: '', leaveSt: '', offset: 0, token: '', nav: 0, dirty: false };
var WD = ['', '一', '二', '三', '四', '五', '六', '日'];
var COLORS = ['#0b5cad', '#2e7d32', '#8e24aa', '#ef6c00', '#00838f', '#6d4c41'];

    return Promise.resolve(JSON.parse(CACHE[key].j));

    busy(1);

  }

      else if (!NO_CLEAR[fn]) cacheClear();
      res(r);

    busy(-1);

function compress(file, max, q) {

        res(c.toDataURL('image/jpeg', q || 0.8));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

var ATT_TYPES = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', doc: 'application/msword',

function drawAtts(msg) {

function attFiles(files) {

}
function attUpload(f) {
  var type = ATT_TYPES[attExt(f.name)];

  if (f.size > ATT_MAX_MB * 1048576) { toast(f.name + ' 超過 ' + ATT_MAX_MB + 'MB', true); return Promise.resolve(); }
  APP.attBusy++; drawAtts('上傳中：' + f.name);
  return attSend(f, type).then(function (url) {
    APP.atts.push({ name: f.name, url: url, size: f.size }); drawAtts();
    if ($('sTitle') && !$('sTitle').value.trim()) $('sTitle').value = f.name.replace(/\.\w+$/, '');
  }).catch(function (e) {

  }).then(function () { APP.attBusy--; });

function attSend(f, type) {
  if (!window.blobPut) return Promise.reject(new Error('請從 Vercel 網址開啟系統才能上傳'));
  return fetch('/api/upload-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: APP.token, name: f.name, size: f.size }) })
    .then(function (r) { return r.json(); }).then(function (j) {

    }).then(function (b) { return b.url; });

/** 算請假時數：只算上班時間內，扣午休（與後端同一套算法，送出後以後端為準） */
function leaveHoursOf(s, st, e, et) {
  var hm = function (x) { var p = x.split(':'); return +p[0] * 60 + +p[1]; };
  var set = APP.init.settings, w = (set['上班時間'] || '').match(/\d{1,2}:\d{2}/g) || ['08:00', '17:30'], l = (set['午休時間'] || '').match(/\d{1,2}:\d{2}/g);
  var total = 0;
  for (var d = s; d <= e; d = addDays(d, 1)) {
    var a = hm(d === s ? st : w[0]), b = hm(d === e ? et : w[1] || '17:30');
    if (b <= a) continue;
    total += b - a - (l && l[1] ? Math.max(0, Math.min(b, hm(l[1])) - Math.max(a, hm(l[0]))) : 0);
  }
  return Math.round(total / 60 * 100) / 100;
}

  $('lvHint').innerHTML = '<div class="muted">共 ' + (e >= s ? leaveHoursOf(s, $('lvSt').value, e, $('lvEt').value) : 0) + ' 小時</div>' + (left < 7 && left >= 0 ? '<div class="notice warn" style="margin:6px 0 0;padding:8px 12px">距離請假日只剩 ' + left + ' 天，未滿 1 週。還是可以送出，但請盡早告知主管。</div>' : '');

/* ---------- 巡檢 ---------- */
function pageInsp() {
  APP.dirty = false;
  $('main').innerHTML = '<div class="sub"><button class="' + (APP.inspSub === 'fill' ? 'on' : '') + '" onclick="APP.inspSub=\'fill\';pageInsp()">填寫巡檢</button>' +
    '<button class="' + (APP.inspSub === 'hist' ? 'on' : '') + '" onclick="APP.inspSub=\'hist\';pageInsp()">巡檢紀錄</button></div>' +
    (isAdmin() ? ' <button class="btn sm" style="vertical-align:top;margin-top:5px" onclick="APP.adminSub=\'items\';go(\'admin\')">編輯巡檢項目與附件</button>' : '') + '<div id="inBody">' + LOADER + '</div>';
  if (APP.inspSub === 'hist') return drawInspHist();
  api('api_getInspections', APP.inspDate).then(function (r) { APP.insp = r; APP.inspDraft = {}; drawInsp(); });
}
function drawInsp() {
  var r = APP.insp;
  var html = '<div class="row" style="margin-bottom:14px"><input type="date" id="inDate" value="' + r.date + '" max="' + APP.init.today + '" onchange="APP.inspDate=this.value;pageInsp()">' +
    (r.date !== APP.init.today ? '<span class="tag warn">補登過去日期</span>' : '') + '</div>';
  APP.init.freqs.forEach(function (f) {
    var items = r.items.filter(function (i) { return i.freq === f; });
    if (!items.length) return;
    var st = r.status[f], last = r.last[f];
    var editing = !st.done || APP.inspEdit === f;
    html += '<div class="card"><h2>' + f + '巡檢<span class="muted" style="font-weight:normal">' + esc(st.label) + '</span>' +
      (st.done ? '<span class="tag ' + (st.abnormal ? 'bad' : 'ok') + '">' + (st.abnormal ? '異常 ' + st.abnormal : '✓ 完成') + '</span>' : '') +
      '<span class="sp"></span>' + (st.done && !editing ? '<span class="muted" style="font-weight:normal">' + esc(st.by) + ' ' + esc(st.at.slice(5)) + '</span><button class="btn sm ghost" onclick="APP.inspEdit=\'' + f + '\';drawInsp()">重填</button><button class="btn sm ghost" onclick="printInspNow(\'' + f + '\')">列印</button>' : '') +
      (editing ? '<button class="btn sm ghost" onclick="allOk(\'' + f + '\')">全部正常</button>' : '') + '</h2>';
    if (f === '保固期滿前') html += '<div class="muted">保固期滿日：' + esc(r.warrantyEnd || '（未設定，請主管到「管理 → 設定」填寫）') + '</div>';
    var curMajor = null, curArea = null;
    items.forEach(function (it) {
      var prev = last.filter(function (x) { return x.itemId === it.id; })[0];
      var head = '';
      if (it.major !== curMajor) { head += '<div class="major">' + esc(it.major) + '</div>'; curMajor = it.major; curArea = null; }
      if (it.area !== curArea) { head += '<div class="minor">' + esc(it.area) + '</div>'; curArea = it.area; }
      if (!editing) { // 完成後只列出異常項目
        var abn = prev && prev.result === '異常';
        if (abn || it.atts.length) {
          var bad = abn ? (prev.checks || []).filter(function (c) { return !c.ok; }).map(function (c) { return c.t; }) : [];
          html += head + '<div class="chk"><div><b>' + esc(it.item) + '</b>' + (bad.length ? '<div style="color:var(--bad)">' + bad.map(esc).join('、') + '</div>' : '') + (abn && prev.note ? '<div>說明：' + esc(prev.note) + '</div>' : '') + attList(it.atts) + '</div>' +
            '<div>' + (abn ? '<span class="tag bad">異常</span>' : '') + '</div></div>';
        }
        return;
      }
      var dv = APP.inspDraft[it.id];
      if (!dv) {
        dv = APP.inspDraft[it.id] = { id: it.id, result: '', note: '', level: '2', checks: it.checks.map(function (t) { return { t: t, ok: true }; }) };
        if (prev && APP.inspEdit === f) {
          dv.result = prev.result; dv.note = prev.note;
          (prev.checks || []).forEach(function (c) { dv.checks.forEach(function (x) { if (x.t === c.t) x.ok = c.ok; }); });
        }
      }
      html += head + '<div class="chk' + (dv.result === '異常' ? ' abn' : '') + '" id="ck_' + it.id + '"><div><b>' + esc(it.item) + '</b>' +
        dv.checks.map(function (c, i) { return '<label class="ln"><input type="checkbox"' + (c.ok ? ' checked' : '') + ' onchange="setLine(\'' + it.id + '\',' + i + ',this.checked)"><span>' + esc(c.t) + '</span></label>'; }).join('') + attList(it.atts) + '</div>' +
        '<div class="seg"><button class="' + (dv.result === '正常' ? 'on-ok' : '') + '" onclick="setChk(\'' + it.id + '\',\'正常\')">正常</button><button class="' + (dv.result === '異常' ? 'on-bad' : '') + '" onclick="setChk(\'' + it.id + '\',\'異常\')">異常</button></div>' +
        '<div class="ext"><input class="full" placeholder="異常說明" value="' + esc(dv.note) + '" oninput="APP.inspDraft[\'' + it.id + '\'].note=this.value">' +
        '<span class="muted">送出後自動開叫修單，等級：</span><select onchange="APP.inspDraft[\'' + it.id + '\'].level=this.value">' + ['1', '2', '3'].map(function (l) { return '<option value="' + l + '"' + (dv.level === l ? ' selected' : '') + '>' + APP.init.sla[l].name + '</option>'; }).join('') + '</select></div></div>';
    });
    if (editing) {
      var conf = last.length ? last[0].confirmBy : '';
      html += '<div class="row" style="margin-top:12px"><input id="conf_' + f + '" value="' + esc(conf) + '" placeholder="機關確認人（選填）" style="flex:1;min-width:150px">' +
        (APP.inspEdit === f ? '<button class="btn" onclick="APP.inspEdit=null;drawInsp()">取消</button>' : '') +
        '<button class="btn p" onclick="submitInsp(\'' + f + '\')">送出</button></div>';
    }
    html += '</div>';
  });
  $('inBody').innerHTML = html;
}
/** 取消勾選一條檢查內容＝這個項目異常；全部勾回去不會自動改回正常，由人確認 */
function setLine(id, i, ok) {
  APP.inspDraft[id].checks[i].ok = ok;
  APP.dirty = true;
  if (!ok) setChk(id, '異常');
}
function setChk(id, v) {
  var dv = APP.inspDraft[id];
  dv.result = v;
  if (v === '正常') { dv.checks.forEach(function (c) { c.ok = true; }); Array.prototype.forEach.call($('ck_' + id).querySelectorAll('.ln input'), function (c) { c.checked = true; }); }
  var el = $('ck_' + id), b = el.querySelectorAll('.seg button');
  b[0].className = v === '正常' ? 'on-ok' : ''; b[1].className = v === '異常' ? 'on-bad' : '';
  el.classList.toggle('abn', v === '異常');
}
function allOk(f) {
  APP.insp.items.filter(function (i) { return i.freq === f; }).forEach(function (i) {
    var d = APP.inspDraft[i.id];
    if (d && d.result !== '異常') setChk(i.id, '正常');
  });
}
function submitInsp(f) {
  var items = APP.insp.items.filter(function (i) { return i.freq === f; });
  var res = items.map(function (i) { return APP.inspDraft[i.id]; });
  var miss = res.filter(function (x) { return !x.result; });
  if (miss.length) return toast('還有 ' + miss.length + ' 項沒勾', true);
  if (res.some(function (x) { return x.result === '異常' && !x.note.trim() && x.checks.every(function (c) { return c.ok; }); })) return toast('異常項目請取消勾選有問題的內容，或填說明', true);
  api('api_submitInspection', f, APP.insp.date, res, val('conf_' + f)).then(function (r) {
    APP.inspEdit = null;
    toast(f + '巡檢已送出' + (r.abnormal ? '，異常 ' + r.abnormal + ' 項已通知主管' : '') + (r.tickets.length ? '，已自動開叫修單 ' + r.tickets.join('、') : ''));
    pageInsp();
  });
}
function inspPrintHtml(freq, label, by, at, confirmBy, rows) {
  return '<h2>駐點' + freq + '巡檢表</h2><p>期別：' + esc(label) + '　巡檢人：' + esc(by) + '　巡檢時間：' + esc(at) + '</p>' +
    '<table><tr><th>大項</th><th>中項</th><th>小項與檢查內容</th><th>正常</th><th>異常</th><th>說明</th></tr>' +
    rows.map(function (x) { return '<tr><td>' + esc(x.major || '') + '</td><td>' + esc(x.area) + '</td><td>' + esc(x.item) + (x.checks || []).map(function (c) { return '<br>' + (c.ok ? '■ ' : '□ ') + esc(c.t); }).join('') + '</td><td>' + (x.result === '正常' ? '■' : '□') + '</td><td>' + (x.result === '異常' ? '■' : '□') + '</td><td>' + esc(x.note) + '</td></tr>'; }).join('') +
    '</table><p style="margin-top:24px">機關確認：' + esc(confirmBy || '＿＿＿＿＿＿＿＿') + '</p>';
}
function printInspNow(f) {
  var r = APP.insp, st = r.status[f];
  var rows = r.items.filter(function (i) { return i.freq === f; }).map(function (i) {
    var p = r.last[f].filter(function (x) { return x.itemId === i.id; })[0] || {};

function drawInspHist() {

  api('api_inspectionHistory', m).then(function (h) {

  var r = APP.stats, rows;

/** Excel 開得起來的 CSV；開頭是 = + - @ 的文字先加單引號，避免被當公式 */
function downloadCsv(name, rows) {
  var cell = function (v) { var s = String(v == null ? '' : v); if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('已下載 ' + name);
}

    '<label class="f">' + (type === '盤點' ? '實際數量 *' : '數量 *') + '</label><input id="smQ" type="number" min="0" value="' + (type === '盤點' ? x.qty : 1) + '" style="width:120px">' +
    '<label class="f">說明</label><input id="smN" class="full" placeholder="' + (type === '領用' ? '例：閘門 2 更換' : '') + '">' +
    '<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="stockMoveGo(\'' + id + '\',\'' + type + '\')">確定</button></div>');
}
function stockMoveGo(id, type) { api('api_stockMove', { id: id, type: type, qty: Number(val('smQ')), note: val('smN') }).then(function () { closeModal(); toast('已更新庫存'); pageStock(); }); }
function stockForm(id) {
  var x = id ? APP.stock.items.filter(function (i) { return i.id === id; })[0] : { type: '備品', name: '', spec: '', unit: '個', place: '', safe: 0, qty: 0, note: '', active: true };
  modal('<h3>' + (id ? '編輯品項' : '新增品項') + '<button class="x" onclick="closeModal()">×</button></h3>' +
    '<div class="chips">' + ['備品', '耗材'].map(function (t) { return '<label><input type="radio" name="skT" value="' + t + '"' + (x.type === t ? ' checked' : '') + '><span>' + t + '</span></label>'; }).join('') + '</div>' +
    '<label class="f">品名 *</label><input id="skN" class="full" value="' + esc(x.name) + '">' +
    '<label class="f">規格</label><input id="skS" class="full" value="' + esc(x.spec) + '">' +
    '<div class="row"><div><label class="f">單位</label><input id="skU" value="' + esc(x.unit) + '" style="width:90px"></div><div><label class="f">安全存量</label><input id="skF" type="number" min="0" value="' + x.safe + '" style="width:110px"></div>' + (id ? '' : '<div><label class="f">目前數量</label><input id="skQ" type="number" min="0" value="0" style="width:110px"></div>') + '</div>' +
    '<label class="f">存放位置</label><input id="skP" class="full" value="' + esc(x.place) + '"><label class="f">備註</label><input id="skO" class="full" value="' + esc(x.note) + '">' +
    '<label style="display:block;margin-top:10px"><input type="checkbox" id="skA"' + (x.active ? ' checked' : '') + '> 啟用</label>' +
    '<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="stockSave(\'' + esc(id || '') + '\')">儲存</button></div>');
}
function stockSave(id) {
  api('api_saveStock', { id: id, type: document.querySelector('input[name=skT]:checked').value, name: val('skN'), spec: val('skS'), unit: val('skU'), safe: Number(val('skF')) || 0, qty: Number(val('skQ')) || 0, place: val('skP'), note: val('skO'), active: $('skA').checked }).then(function () { closeModal(); toast('已儲存'); pageStock(); });
}

/* ---------- 公告與討論 ---------- */
function pageBoard() {
  api('api_listBoard').then(function (r) { APP.board = r; drawBoard(); });
}
function drawBoard() {
  var r = APP.board, sub = APP.boardSub || 'notice', admin = isAdmin(), me = APP.init.me;
  var html = '<div class="sub"><button class="' + (sub === 'notice' ? 'on' : '') + '" onclick="APP.boardSub=\'notice\';drawBoard()">公告欄</button><button class="' + (sub === 'talk' ? 'on' : '') + '" onclick="APP.boardSub=\'talk\';drawBoard()">討論區</button></div>';
  if (sub === 'notice') {
    html += '<div class="card"><h2>公告<span class="sp"></span>' + (admin ? '<button class="btn p" onclick="noticeForm()">發布公告</button>' : '') + '</h2>' + (r.notices.length ? r.notices.map(function (n) {
      return '<div class="post"><div class="row"><b>' + esc(n.title) + '</b>' + (n.pinned ? '<span class="tag warn">置頂</span>' : '') + (n.expire && n.expire < APP.init.today ? '<span class="tag">已到期</span>' : '') + '<span class="sp"></span>' + (admin ? '<button class="btn sm ghost" onclick="noticeForm(\'' + n.id + '\')">編輯</button>' : '') + '</div><div class="muted">' + esc(n.by) + ' ' + esc(n.at) + '</div><div class="body">' + esc(n.body) + '</div>' + attList(n.atts) + '</div>';
    }).join('') : '<div class="empty">目前沒有公告</div>') + '</div>';
  } else {
    html += '<div class="card"><h2>討論區<span class="sp"></span><button class="btn p" onclick="topicForm()">發表主題</button></h2>' + (r.topics.length ? r.topics.map(function (t) {
      return '<div class="post"><div class="row"><b>' + esc(t.title) + '</b><span class="sp"></span>' + (admin || t.email === me.email ? '<button class="btn sm ghost" onclick="talkDel(\'' + t.id + '\')">刪除</button>' : '') + '</div><div class="muted">' + esc(t.name) + ' ' + esc(t.at) + '</div><div class="body">' + esc(t.body) + '</div>' +
        t.replies.map(function (x) { return '<div class="reply"><div class="row"><b style="font-size:13px">' + esc(x.name) + '</b><span class="muted">' + esc(x.at.slice(5)) + '</span><span class="sp"></span>' + (admin || x.email === me.email ? '<button class="btn sm ghost" onclick="talkDel(\'' + x.id + '\')">刪除</button>' : '') + '</div><div class="body">' + esc(x.body) + '</div></div>'; }).join('') +
        '<div class="row" style="margin:8px 0 0 12px"><input id="rp_' + t.id + '" placeholder="回覆…" style="flex:1;min-width:0"><button class="btn sm" onclick="talkReply(\'' + t.id + '\')">送出</button></div></div>';
    }).join('') : '<div class="empty">還沒有討論，按「發表主題」開始</div>') + '</div>';
  }
  $('main').innerHTML = html;
}
function noticeForm(id) {
  var n = id ? APP.board.notices.filter(function (x) { return x.id === id; })[0] : { title: '', body: '', pinned: false, expire: '', atts: [] };
  modal('<h3>' + (id ? '編輯公告' : '發布公告') + '<button class="x" onclick="closeModal()">×</button></h3><label class="f">標題 *</label><input id="nT" class="full" maxlength="100" value="' + esc(n.title) + '">' +
    '<label class="f">內容</label><textarea id="nB" style="min-height:130px">' + esc(n.body) + '</textarea><label class="f">到期日（過了就不顯示給大家，可空白）</label><input type="date" id="nE" value="' + esc(n.expire) + '">' + attEditor(n.atts) +
    '<label style="display:block;margin-top:10px"><input type="checkbox" id="nP"' + (n.pinned ? ' checked' : '') + '> 置頂</label><label style="display:block;margin-top:6px"><input type="checkbox" id="nM"' + (id ? '' : ' checked') + '> 同時寄信給所有人</label>' +
    '<div class="foot">' + (id ? '<button class="btn bad" style="margin-right:auto" onclick="noticeDel(\'' + id + '\')">刪除</button>' : '') + '<button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="noticeSave(\'' + esc(id || '') + '\')">儲存</button></div>');
}
function noticeSave(id) {
  if (APP.attBusy) return toast('檔案還在上傳，請稍等', true);
  api('api_saveNotice', { id: id, title: val('nT'), body: $('nB').value, expire: val('nE'), pinned: $('nP').checked, mail: $('nM').checked, atts: APP.atts }).then(function () { closeModal(); toast('已儲存'); pageBoard(); });
}
function noticeDel(id) { if (confirm('確定刪除這則公告？')) api('api_deleteNotice', id).then(function () { closeModal(); toast('已刪除'); pageBoard(); }); }
function topicForm() {
  modal('<h3>發表主題<button class="x" onclick="closeModal()">×</button></h3><label class="f">主題 *</label><input id="dT" class="full" maxlength="100"><label class="f">內容 *</label><textarea id="dB" maxlength="3000" style="min-height:130px"></textarea>' +
    '<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="topicSave()">發表</button></div>');
}
function topicSave() { api('api_postDiscuss', { title: val('dT'), body: $('dB').value }).then(function () { closeModal(); toast('已發表'); pageBoard(); }); }
function talkReply(id) { var b = val('rp_' + id); if (!b) return toast('請填寫內容', true); api('api_postDiscuss', { topic: id, body: b }).then(function () { pageBoard(); }); }
function talkDel(id) { if (confirm('確定刪除這則留言？')) api('api_deleteDiscuss', id).then(function () { toast('已刪除'); pageBoard(); }); }

boot();
</script>
</body>
</html>
