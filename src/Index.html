<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2430; --muted: #8a94a3; --line: #eceef2;
    --primary: #1f6feb; --primary-weak: #eaf2ff; --ok: #1a8f4c; --ok-weak: #e8f6ee;
    --warn: #b7791f; --warn-weak: #fdf4e3; --bad: #d93a3a; --bad-weak: #fdeeee;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); }
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .hd-in { max-width: 1000px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 20px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 2px; flex: 1; height: 100%; }
  nav button { border: 0; background: none; padding: 0 12px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; font-family: inherit; position: relative; display: flex; align-items: center; gap: 6px; }
  nav button svg { display: none; }
  nav button.on { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--text); }
  nav .dot { position: absolute; top: 12px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .who { position: relative; margin-left: auto; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--primary-weak); color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .menu { position: absolute; right: 0; top: 42px; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(20,30,50,.14); min-width: 170px; padding: 6px; display: none; }
  .menu.on { display: block; }
  .menu .me { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text); }
  .menu button:hover { background: var(--bg); }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(20,30,50,.04); }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 .sp, .sp { flex: 1; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .big { font-size: 22px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .hello { margin: 2px 2px 14px; }
  .hello b { font-size: 20px; font-weight: 600; display: block; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit; line-height: 1.3; text-decoration: none; display: inline-block; }
  .btn:hover { background: #f8f9fb; }
  .btn.p { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .btn.bad { color: var(--bad); }
  .btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--bg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: #f1f3f6; color: var(--muted); white-space: nowrap; font-weight: 500; }
  .tag.ok { background: var(--ok-weak); color: var(--ok); }
  .tag.warn { background: var(--warn-weak); color: var(--warn); }
  .tag.bad { background: var(--bad-weak); color: var(--bad); }
  .tag.p { background: var(--primary-weak); color: var(--primary); }
  .lv1 { background: var(--bad-weak); color: var(--bad); } .lv2 { background: var(--warn-weak); color: var(--warn); } .lv3 { background: #f1f3f6; color: #5b6573; }
  input, select, textarea { font-family: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid #dfe3e8; border-radius: 10px; background: #fff; max-width: 100%; color: var(--text); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  input[type=checkbox], input[type=radio] { accent-color: var(--primary); }
  textarea { width: 100%; min-height: 80px; }
  label.f { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--muted); }
  .full { width: 100%; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: middle; }
  table.t th { font-weight: 500; color: var(--muted); font-size: 12px; }
  table.t tr:last-child td { border-bottom: 0; }
  .tw { overflow-x: auto; }
  .list-item { padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover { background: #fafbfc; }
  /* 待辦 */
  .todo { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .todo:last-child { border-bottom: 0; }
  .todo .ic { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .todo .ic.bad { background: var(--bad); } .todo .ic.p { background: var(--primary); }
  .todo .tx { flex: 1; }
  .todo .go { color: var(--muted); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .kv span:first-child { color: var(--muted); white-space: nowrap; }
  /* 月曆 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .hd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal .d { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 72px; padding: 5px 6px; cursor: pointer; font-size: 12px; position: relative; overflow: hidden; }
  .cal .d:hover { border-color: #cfd5dd; }
  .cal .d.past { opacity: .45; }
  .cal .d.today { border-color: var(--text); }
  .cal .d.mineoff { background: var(--bad-weak); }
  .cal .d.gap { border-color: var(--bad); }
  .cal .n { font-size: 13px; color: #5b6573; }
  .cal .we .n { color: var(--bad); }
  .cal .who { display: block; margin-top: 4px; padding: 2px 6px; border-radius: 6px; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .off { display: block; color: var(--bad); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal .mk { position: absolute; right: 6px; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); font-size: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  /* 巡檢 */
  .chk { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .chk:last-child { border-bottom: 0; }
  .seg { display: inline-flex; background: #f1f3f6; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; font-size: 14px; font-family: inherit; border-radius: 8px; color: #5b6573; }
  .seg button.on-ok { background: #fff; color: var(--ok); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg button.on-bad { background: #fff; color: var(--bad); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chk .ext { grid-column: 1 / -1; display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chk.abn .ext { display: flex; }
  /* 選項 chip */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { border: 1px solid #dfe3e8; border-radius: 10px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
  .chips input { display: none; }
  .chips input:checked + span { color: var(--primary); font-weight: 600; }
  .chips label:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); }
  .lvbox { border: 1px solid #dfe3e8; border-radius: 10px; padding: 9px 12px; margin: 6px 0; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .lvbox:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); }
  /* SOP 內容 */
  .doc h3 { font-size: 15px; margin: 18px 0 6px; }
  .doc ul, .doc ol { margin: 4px 0; padding-left: 22px; }
  .doc p { margin: 4px 0; }
  .timeline { font-size: 13px; background: var(--bg); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; }
  /* 叫修列表 */
  .tk { display: flex; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tk:last-child { border-bottom: 0; }
  .tk .bar { width: 4px; border-radius: 2px; flex: none; background: #c9cfd8; }
  .tk .bar.l1 { background: var(--bad); } .tk .bar.l2 { background: var(--warn); }
  .tk .bd { flex: 1; min-width: 0; }
  .tk .t1 { display: flex; gap: 8px; align-items: center; }
  .tk .t1 b { font-weight: 600; }
  .tk .sym { color: #4a5361; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 打卡 */
  .punch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .punch button { border: 0; border-radius: 12px; padding: 18px 8px; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .punch .in { background: var(--text); color: #fff; } .punch .out { background: #f1f3f6; color: var(--text); }
  .punch button.done { background: var(--ok-weak); color: var(--ok); }
  .punch small { display: block; font-size: 13px; font-weight: normal; opacity: .75; margin-top: 2px; }
  .thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; vertical-align: middle; margin-left: 6px; background: #f1f3f6; }
  #pPrev { max-width: 100%; max-height: 260px; border-radius: 12px; display: none; margin-top: 10px; }
  .camera-btn { display: block; text-align: center; background: var(--bg); border-radius: 12px; padding: 26px 10px; cursor: pointer; color: #5b6573; }
  .camera-btn input { display: none; }
  .drop { display: block; text-align: center; border: 1.5px dashed #cfd5dd; border-radius: 12px; padding: 18px 10px; cursor: pointer; color: #5b6573; font-size: 14px; }
  .drop:hover, .drop.on { border-color: var(--primary); background: var(--primary-weak); }
  .drop input { display: none; }
  .att { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .att:last-child { border-bottom: 0; }
  .att .ext { flex: none; width: 42px; text-align: center; border-radius: 6px; padding: 2px 0; font-size: 11px; font-weight: 600; background: #f1f3f6; color: #5b6573; }
  .att .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters input[type=date] { width: 150px; }
  /* modal / toast */
  .mask { position: fixed; inset: 0; background: rgba(15,20,30,.35); display: none; align-items: flex-start; justify-content: center; z-index: 20; overflow-y: auto; padding: 32px 12px; }
  .mask.on { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(15,20,30,.2); }
  .modal h3 { margin: 0 0 12px; font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .modal h3 .x { margin-left: auto; cursor: pointer; font-size: 22px; color: var(--muted); border: 0; background: none; line-height: 1; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 10px; display: none; z-index: 30; max-width: 90vw; font-size: 14px; }
  #toast.bad { background: var(--bad); }
  #loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; display: none; z-index: 40; overflow: hidden; }
  #loading::before { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, transparent, #6ea8ff, var(--primary)); animation: ld 1.1s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes ld { 0% { left: -45% } 100% { left: 100% } }
  .loader { animation: fadein .2s ease both; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .load-tx { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 14px; color: var(--muted); font-size: 13px; }
  .load-tx i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: dot 1.1s ease-in-out infinite; }
  .load-tx i:nth-child(2) { animation-delay: .15s; } .load-tx i:nth-child(3) { animation-delay: .3s; margin-right: 2px; }
  @keyframes dot { 0%, 70%, 100% { transform: translateY(0); opacity: .35 } 35% { transform: translateY(-5px); opacity: 1 } }
  .sk { display: block; height: 14px; border-radius: 7px; margin-bottom: 12px; background: linear-gradient(90deg, #eef0f4 25%, #f8f9fb 50%, #eef0f4 75%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  .sk:last-child { margin-bottom: 0; }
  .sk.h { width: 28%; height: 16px; margin-bottom: 18px; } .sk.w8 { width: 82%; } .sk.w6 { width: 62%; } .sk.w4 { width: 44%; }
  .sk.block { height: 74px; border-radius: 12px; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .sk, .load-tx i, #loading::before { animation-duration: 3s; } }
  .url { display: block; margin: 6px 0 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 14px; word-break: break-all; color: var(--text); text-decoration: none; }
  .sub { display: inline-flex; background: #e9ecf0; border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 14px; flex-wrap: wrap; }
  .sub button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; color: #5b6573; }
  .sub button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .empty { color: var(--muted); padding: 14px 0; text-align: center; font-size: 14px; }
  #print { display: none; }
  @media print {
    body.printing > *:not(#print) { display: none !important; }
    body.printing #print { display: block; font-size: 12pt; }
    #print table { width: 100%; border-collapse: collapse; }
    #print th, #print td { border: 1px solid #000; padding: 5px; text-align: left; vertical-align: top; }
    #print h2 { text-align: center; }
  }
  /* 手機：選單改到底部 */
  @media (max-width: 760px) {
    .hd-in { height: 52px; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; height: auto; background: #fff; border-top: 1px solid var(--line); gap: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
    nav button { flex: 1; flex-direction: column; gap: 2px; padding: 7px 0 6px; font-size: 11px; }
    nav button svg { display: block; width: 22px; height: 22px; }
    nav button.on { box-shadow: none; color: var(--primary); }
    nav .dot { top: 5px; right: calc(50% - 16px); }
    main { padding: 14px 12px 90px; }
    .card { padding: 16px; }
    .cal { gap: 2px; }
    .cal .d { min-height: 58px; padding: 3px; border-radius: 8px; }
    .cal .who { font-size: 11px; padding: 1px 3px; }
    table.t { font-size: 13px; }
    .modal { padding: 18px; }
    .filters input[type=date] { flex: 1; width: auto; min-width: 0; }
    .filters select { flex-basis: 100%; }
    .card h2 > .row { width: 100%; justify-content: flex-end; }
    #toast { bottom: 84px; }
  }
</style>
</head>
<body>
<div id="loading"></div>
<header><div class="hd-in"><h1 id="appTitle">駐點維運系統</h1><nav id="nav"></nav><div class="who" id="who"></div></div></header>
<main id="main"><div class="loader"><div class="load-tx"><i></i><i></i><i></i>載入中</div><div class="card"><span class="sk h"></span><span class="sk block"></span></div><div class="card"><span class="sk h"></span><span class="sk"></span><span class="sk w8"></span><span class="sk w6"></span><span class="sk w4"></span></div></div></main>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
var APP = { init: null, page: 'home', month: null, tkFilter: 'open', tkSub: 'tickets', inspSub: 'fill', inspDate: null, sopCat: '全部', sopQ: '', adminSub: 'people', offset: 0, token: '' };
var WD = ['', '一', '二', '三', '四', '五', '六', '日'];
var COLORS = ['#0b5cad', '#2e7d32', '#8e24aa', '#ef6c00', '#00838f', '#6d4c41'];
var NOAUTH = ['api_login', 'api_googleLogin'];
var TOKEN_KEY = 'kos_token';
var LOADER = '<div class="loader"><div class="load-tx"><i></i><i></i><i></i>載入中</div><div class="card"><span class="sk h"></span><span class="sk block"></span></div><div class="card"><span class="sk h"></span><span class="sk"></span><span class="sk w8"></span><span class="sk w6"></span><span class="sk w4"></span></div></div>';
var PENDING = 0;
function busy(n) { PENDING = Math.max(0, PENDING + n); $('loading').style.display = PENDING ? 'block' : 'none'; }
function loadFailed() { var l = document.querySelector('.loader'); if (l) l.outerHTML = '<div class="card"><div class="empty">載入失敗<div style="margin-top:10px"><button class="btn" onclick="go(APP.page)">重新載入</button></div></div></div>'; }

/* ---------- 共用 ---------- */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (NOAUTH.indexOf(fn) < 0) args.unshift(APP.token);
  busy(1);
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) { busy(-1); res(r); })
      .withFailureHandler(function (e) {
        busy(-1);
        var msg = e && e.message ? e.message : String(e);
        if (msg.indexOf('NEED_LOGIN') >= 0) { saveToken(''); showLogin('登入已過期，請重新登入'); }
        else { toast(msg, true); loadFailed(); }
        rej(e);
      })[fn].apply(null, args);
  });
}
function saveToken(t) { APP.token = t || ''; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { } }
function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(msg, bad) { var t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, bad ? 6000 : 2600); }
function modal(html) { $('modal').innerHTML = html; $('mask').classList.add('on'); if ($('attBox')) drawAtts(); }
function closeModal() { APP.lockModal = false; $('mask').classList.remove('on'); }
document.addEventListener('click', function () { var m = $('menu'); if (m) m.classList.remove('on'); });
function md(d) { var p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
function wdOf(d) { var w = new Date(d + 'T12:00:00+08:00').getUTCDay(); return w === 0 ? 7 : w; } // 以台灣日期計
function addDays(d, n) { var t = new Date(d + 'T12:00:00+08:00'); t.setTime(t.getTime() + n * 86400000); return tw(t).slice(0, 10); }
function tw(dt) { var x = new Date(dt.getTime() + 8 * 3600000); return x.toISOString().slice(0, 16).replace('T', ' '); }
function nowStr() { return tw(new Date(Date.now() + APP.offset)); }
function parseT(s) { return new Date(s.replace(' ', 'T') + ':00+08:00').getTime(); }
function shiftMonth(m, n) { var p = m.split('-'), y = +p[0], mm = +p[1] + n; while (mm > 12) { mm -= 12; y++; } while (mm < 1) { mm += 12; y--; } return y + '-' + (mm < 10 ? '0' : '') + mm; }
function isAdmin() { return APP.init.me.isAdmin; }
function colorOf(email) { var st = APP.init.people.filter(function (p) { return p.sched; }); var i = st.map(function (p) { return p.email; }).indexOf(email); return COLORS[(i < 0 ? 5 : i) % COLORS.length]; }
function remain(due) {
  var m = Math.round((parseT(due) - (Date.now() + APP.offset)) / 60000);

function renderDoc(txt) {
  var lines = String(txt || '').split('\n'), out = '', list = '';
  var close = function () { if (list) { out += '</' + list + '>'; list = ''; } };
  var link = function (s) { return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>'); };
  lines.forEach(function (l) {
    var m;
    if (/^#\s+/.test(l)) { close(); out += '<h3>' + link(l.replace(/^#\s+/, '')) + '</h3>'; }
    else if ((m = l.match(/^\s*[-•●]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + link(m[1]) + '</li>'; }
    else if ((m = l.match(/^\s*\d+[.、]\s*(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + link(m[1]) + '</li>'; }
    else if (!l.trim()) { close(); }
    else { close(); out += '<p>' + link(l) + '</p>'; }
  });
  close();
  return out;
}
function compress(file, max, q) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var r = Math.min(1, (max || 1280) / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q || 0.8));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function uploadFiles(input) {
  var files = Array.prototype.slice.call(input.files || []);
  return files.reduce(function (p, f) {
    return p.then(function (ids) { return compress(f).then(function (d) { return api('api_uploadPhoto', f.name.replace(/\.\w+$/, '') + '.jpg', d); }).then(function (id) { ids.push(id); return ids; }); });
  }, Promise.resolve([]));
}
function photoHtml(ids) {

  return '<div class="photos">' + ids.map(function (id) {
    if (/^https:\/\//.test(id)) return '<a href="' + esc(id) + '" target="_blank"><img src="' + esc(id) + '" alt="照片"></a>';
    return '<a href="https://drive.google.com/file/d/' + esc(id) + '/view" target="_blank"><img src="https://drive.google.com/thumbnail?id=' + esc(id) + '&sz=w300" alt="照片"></a>';
  }).join('') + '</div>';
}

var ATT_TYPES = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', doc: 'application/msword',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
var ATT_MAX_MB = 50;
function attExt(n) { var m = String(n).match(/\.(\w+)$/); return m ? m[1].toLowerCase() : ''; }
function attSize(b) { return !b ? '' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
/** 檢視用：PDF、圖檔可直接開啟，每個都能下載 */
function attList(atts) {
  return (atts || []).map(function (a) {
    var e = attExt(a.name), canOpen = /^(pdf|jpe?g|png|gif|webp)$/.test(e);
    return '<div class="att"><span class="ext">' + esc(e.toUpperCase()) + '</span><span class="nm">' + esc(a.name) + (a.size ? ' <span class="muted">' + attSize(a.size) + '</span>' : '') + '</span>' +
      (canOpen ? '<a class="btn sm ghost" href="' + esc(a.url) + '" target="_blank" rel="noopener">開啟</a>' : '') +
      '<a class="btn sm" href="' + esc(a.url) + '?download=1">下載</a></div>';
  }).join('');
}
/** 編輯用：上傳區＋已上傳清單（內容放在 APP.atts，按表單的儲存才算數） */
function attEditor(atts) {
  APP.atts = (atts || []).slice(); APP.attBusy = 0;
  return '<label class="f">附件（PDF、圖檔、Word、Excel，每個 ' + ATT_MAX_MB + 'MB 以內）</label>' +
    '<label class="drop" id="attDrop" ondragover="event.preventDefault();this.classList.add(\'on\')" ondragleave="this.classList.remove(\'on\')" ondrop="event.preventDefault();this.classList.remove(\'on\');attFiles(event.dataTransfer.files)">點這裡選檔案，或把檔案拖進來' +
    '<input type="file" id="sFile" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.xls,.xlsx" onchange="attFiles(this.files);this.value=\'\'"></label>' +
    '<div id="attBox" style="margin-top:6px"></div>';
}
function drawAtts(msg) {
  var b = $('attBox');
  if (!b) return;
  b.innerHTML = APP.atts.map(function (a, i) {
    return '<div class="att"><span class="ext">' + esc(attExt(a.name).toUpperCase()) + '</span><span class="nm">' + esc(a.name) + ' <span class="muted">' + attSize(a.size) + '</span></span><button class="btn sm ghost" onclick="APP.atts.splice(' + i + ',1);drawAtts()">移除</button></div>';
  }).join('') + (msg ? '<div class="muted" style="padding:8px 0">' + esc(msg) + '</div>' : '');
}
function attFiles(files) {
  Array.prototype.slice.call(files || []).reduce(function (p, f) { return p.then(function () { return attUpload(f); }); }, Promise.resolve());
}
function attUpload(f) {
  var type = ATT_TYPES[attExt(f.name)];
  if (!type) { toast(f.name + '：只能上傳 PDF、圖檔、Word、Excel', true); return Promise.resolve(); }
  if (f.size > ATT_MAX_MB * 1048576) { toast(f.name + ' 超過 ' + ATT_MAX_MB + 'MB', true); return Promise.resolve(); }
  APP.attBusy++; drawAtts('上傳中：' + f.name);
  return attSend(f, type).then(function (url) {
    APP.atts.push({ name: f.name, url: url, size: f.size }); drawAtts();
  }).catch(function (e) {
    drawAtts(); toast(f.name + ' 上傳失敗：' + (e && e.message ? e.message : e), true);
  }).then(function () { APP.attBusy--; });
}
function attSend(f, type) {
  if (!window.blobPut) return Promise.reject(new Error('請從 Vercel 網址開啟系統才能上傳'));
  return fetch('/api/upload-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: APP.token, name: f.name, size: f.size }) })
    .then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error);
      return window.blobPut(j.pathname, f, { access: 'public', token: j.clientToken, contentType: type, multipart: f.size > 10485760,
        onUploadProgress: function (p) { drawAtts('上傳中：' + f.name + ' ' + Math.round(p.percentage) + '%'); } });
    }).then(function (b) { return b.url; });
}

function exportAttendance() {
  var from = val('exF'), to = val('exT');
  if (!from || !to || from > to) return toast('請選正確的日期區間', true);
  $('exGo').disabled = true; $('exGo').textContent = '產生中…';
  var done = function () { if ($('exGo')) { $('exGo').disabled = false; $('exGo').textContent = '下載 Word'; } };
  fetch('/api/attendance', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: APP.token, from: from, to: to, email: $('exW').value, photos: $('exP').checked }) })
    .then(function (r) {
      if ((r.headers.get('Content-Type') || '').indexOf('json') >= 0) return r.json().then(function (j) { throw new Error(j.error || '下載失敗'); });
      var name = decodeURIComponent(r.headers.get('X-Filename') || '%E5%87%BA%E5%8B%A4%E7%B0%BD%E5%88%B0%E8%A1%A8.docx');
      return r.blob().then(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        toast('已下載 ' + name);
      });
    })
    .catch(function (e) {
      var msg = e && e.message ? e.message : String(e);
      if (msg.indexOf('NEED_LOGIN') >= 0) { saveToken(''); showLogin('登入已過期，請重新登入'); } else toast(msg, true);
    })
    .then(done);
}

  if (APP.inspSub === 'hist') return drawInspHist();
  api('api_getInspections', APP.inspDate).then(function (r) { APP.insp = r; APP.inspDraft = {}; drawInsp(); });
}
function drawInsp() {
  var r = APP.insp;
  var html = '<div class="row" style="margin-bottom:14px"><input type="date" id="inDate" value="' + r.date + '" max="' + APP.init.today + '" onchange="APP.inspDate=this.value;pageInsp()">' +
    (r.date !== APP.init.today ? '<span class="tag warn">補登過去日期</span>' : '') + '</div>';
  APP.init.freqs.forEach(function (f) {
    var items = r.items.filter(function (i) { return i.freq === f; });
    if (!items.length) return;
    var st = r.status[f], last = r.last[f];
    var editing = !st.done || APP.inspEdit === f;
    html += '<div class="card"><h2>' + f + '巡檢<span class="muted" style="font-weight:normal">' + esc(st.label) + '</span>' +
      (st.done ? '<span class="tag ' + (st.abnormal ? 'bad' : 'ok') + '">' + (st.abnormal ? '異常 ' + st.abnormal : '✓ 完成') + '</span>' : '') +
      '<span class="sp"></span>' + (st.done && !editing ? '<span class="muted" style="font-weight:normal">' + esc(st.by) + ' ' + esc(st.at.slice(5)) + '</span><button class="btn sm ghost" onclick="APP.inspEdit=\'' + f + '\';drawInsp()">重填</button><button class="btn sm ghost" onclick="printInspNow(\'' + f + '\')">列印</button>' : '') +
      (editing ? '<button class="btn sm ghost" onclick="allOk(\'' + f + '\')">全部正常</button>' : '') + '</h2>';
    if (f === '保固期滿前') html += '<div class="muted">保固期滿日：' + esc(r.warrantyEnd || '（未設定，請主管到「管理 → 設定」填寫）') + '</div>';
    items.forEach(function (it) {
      var prev = last.filter(function (x) { return x.itemId === it.id; })[0];
      if (!editing) { // 完成後只列出異常項目
        var abn = prev && prev.result === '異常';
        if (abn || it.atts.length) html += '<div class="chk"><div><b>' + esc(it.area) + '</b><div class="muted">' + esc(it.item) + '</div>' + (abn && prev.note ? '<div>說明：' + esc(prev.note) + '</div>' : '') + attList(it.atts) + '</div>' +
          '<div>' + (abn ? '<span class="tag bad">異常</span>' : '') + '</div></div>';
        return;
      }
      var dv = APP.inspDraft[it.id] || (APP.inspDraft[it.id] = { id: it.id, result: '', note: '', ticket: true, level: '2' });
      if (!dv.result && prev && APP.inspEdit === f) { dv.result = prev.result; dv.note = prev.note; dv.ticket = false; }

      items.map(function (it, i) {
        return '<tr' + (it.active ? '' : ' style="opacity:.5"') + '><td style="white-space:nowrap">' + esc(it.freq) + '</td><td>' + esc(it.area) + '</td><td>' + esc(it.item) + (it.atts.length ? ' <span class="muted">・' + it.atts.length + ' 個附件</span>' : '') + (it.active ? '' : ' <span class="tag">停用</span>') + '</td>' +
          '<td><button class="btn sm ghost" onclick="itemForm(' + i + ')">編輯</button></td></tr>';
      }).join('') + '</table></div></div>';
  });
}
function itemForm(i) {
  var it = i == null ? { id: '', freq: '每日', area: '', item: '', order: 99, active: true, atts: [] } : APP.items[i];
  modal('<h3>' + (i == null ? '新增巡檢項目' : '編輯巡檢項目') + '<button class="x" onclick="closeModal()">×</button></h3>' +
    '<label class="f">頻率</label><select id="iF">' + APP.init.freqs.map(function (f) { return '<option' + (f === it.freq ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
    '<label class="f">區域 *</label><input id="iA" class="full" value="' + esc(it.area) + '">' +
    '<label class="f">檢查項目 *</label><input id="iI" class="full" value="' + esc(it.item) + '">' +
    '<label class="f">排序</label><input id="iO" type="number" value="' + it.order + '" style="width:100px">' +
    attEditor(it.atts) +
    '<label style="display:block;margin-top:10px"><input type="checkbox" id="iAc"' + (it.active ? ' checked' : '') + '> 啟用</label>' +
    '<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="itemSave(\'' + esc(it.id) + '\')">儲存</button></div>');
}
function itemSave(id) {
  if (APP.attBusy) return toast('檔案還在上傳，請稍等', true);
  api('api_saveInspItem', { id: id, freq: $('iF').value, area: val('iA'), item: val('iI'), order: val('iO'), active: $('iAc').checked, atts: APP.atts })
    .then(function () { closeModal(); toast('已儲存'); adItems(); });
}
function adReport() {
  var m = APP.repMonth || APP.init.today.slice(0, 7);
  api('api_monthReport', m, false).then(function (r) { drawReport(r); });
}
function drawReport(r) {
  var m = r.month, sla = APP.init.sla;
  $('adBody').innerHTML = '<div class="card"><h2><button class="btn sm" onclick="APP.repMonth=shiftMonth(\'' + m + '\',-1);adReport()">‹</button>' + m +
    '<button class="btn sm" onclick="APP.repMonth=shiftMonth(\'' + m + '\',1);adReport()">›</button> 月維護報告<span class="sp"></span>' +
    '<button class="btn p" onclick="makeDoc(\'' + m + '\')">產生 Google 文件</button></h2>' +
    (r.docUrl ? '<p><a class="btn ok" href="' + esc(r.docUrl) + '" target="_blank">開啟產生的月報文件</a></p>' : '') +
    '<h3 style="font-size:15px">一、叫修統計與時限達成</h3><div class="tw"><table class="t"><tr><th>等級</th><th>件數</th><th>回覆準時</th><th>已排除</th><th>排除準時</th></tr>' +
    ['1', '2', '3'].map(function (l) { var x = r.byLv[l]; return '<tr><td>' + lvTag(l) + '</td><td>' + x.total + '</td><td>' + x.replyOk + '</td><td>' + x.fixed + '</td><td>' + x.fixOk + '</td></tr>'; }).join('') + '</table></div>' +
    '<h3 style="font-size:15px">二、巡檢執行</h3><p>每日巡檢：<b>' + r.dailyDone + ' / ' + r.dailyTotal + '</b> 天</p>' +
    ['每週', '每月', '每季'].map(function (f) { return '<p>' + f + '：' + (esc(r.freqDone[f].join('、')) || '<span class="muted">本月無紀錄</span>') + '</p>'; }).join('') +
    (r.abn.length ? '<div class="tw"><table class="t"><tr><th>期別</th><th>頻率</th><th>區域</th><th>異常說明</th></tr>' + r.abn.map(function (a) { return '<tr><td>' + a.map(esc).join('</td><td>') + '</td></tr>'; }).join('') + '</table></div>' : '<p class="muted">巡檢異常：無</p>') +
    '<h3 style="font-size:15px">三、維護工作紀錄</h3><p>共 ' + r.logs.length + ' 筆（明細見「叫修回報 → 維護工作紀錄」）</p>' +
    '<h3 style="font-size:15px">四、待辦事項（未結案叫修）</h3>' + (r.open.length ? r.open.map(function (t) { return '<div>' + lvTag(t.level) + ' ' + esc(t.id) + ' ' + esc(t.equip) + '－' + esc(t.symptom) + ' ' + stTag(t.status) + '</div>'; }).join('') : '<p class="muted">無</p>') +
    '</div>';
}
function makeDoc(m) { api('api_monthReport', m, true).then(function (r) { toast(r.queued ? '月報產生中，約 1 分鐘後會寄到你的信箱' : '已產生月報文件'); drawReport(r); }); }

boot();
</script>
</body>
</html>
